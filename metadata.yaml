name: maimai_card_report
display_name: 舞萌报卡
short_desc: 机厅排卡报卡、查询与超时自动清零
desc: >-
  面向舞萌/音游机厅的排队报卡 AstrBot 插件：机厅与群号绑定、多机台多方位报卡识别、
  排卡人数查询、超时自动清零、异常报卡过滤与黑名单，以及每日开门/闭店语自动生成发送，
  并提供完整的 WebUI 控制面板。
help: 直接发送报卡文本即可记录，例如：zy5k、zy+1k、zy-1、z1y2、中二z1y2、tg2、@bot 5k、内1k外2k；查询排卡发送：zyjk、兆阳几卡、zy?k。
version: 1.2.2
author: ty-2333
repo: https://github.com/ty-2333/astrbot_plugin_maimai_card_report
astrbot_version: ">=4.28.2"
tags:
